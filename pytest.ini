[pytest]
# Limit default test discovery to unit and integration suites.
# Validation scripts under tests/validation/ are intended to be run manually.
testpaths =
    tests/unit
    tests/integration

# Exclure les tests nécessitant des environnements spécialisés
# (STEP2 TransNet -> torch, STEP4 Tracking -> numpy/cv2/mediapipe)
# Ils seront exécutés via leurs scripts dédiés (scripts/run_step2_tests.sh, run_step4_tests.sh).
# L'exclusion elle-même vit dans tests/conftest.py (collect_ignore_glob) : les motifs `!` ne sont
# pas une syntaxe pytest et étaient silencieusement inopérants.
python_files =
    test_*.py

# Useful options (quiet by default is handled by CLI; keep config minimal)
addopts = -q

markers =
    gpu: tests requiring GPU-capable runtime and/or tracking_env dependencies
    integration: integration tests that may touch multiple subsystems
